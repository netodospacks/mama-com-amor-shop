<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CATALOGO VS</title>
    <meta name="description" content="Catálogo Virtual Store">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/vs_admin_icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VIRTUAL STORE">
    <meta property="og:description" content="Catálogo Virtual Store">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Apenas registra o SW se a página for do admin para não afetar caching desnecessário do catálogo
          if (window.location.pathname.startsWith('/admin')) {
            navigator.serviceWorker.register('/sw.js').catch(err => {
              console.log('SW registration failed: ', err);
            });
          }
        });
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
